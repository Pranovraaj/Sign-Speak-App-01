name: Security Review and Performance Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-and-perf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Unit Tests
        working-directory: ./Backend
        run: |
          chmod +x ./mvnw
          ./mvnw test

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'

      - name: Setup K6 for Performance Testing
        uses: grafana/setup-k6-action@v1

      - name: Run K6 Load Test
        working-directory: "./Vulnerability Test Results"
        run: k6 run k6-load-test.js || true

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: Security-Reports
          path: "Vulnerability Test Results/"
          retention-days: 30
