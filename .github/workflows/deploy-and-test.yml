name: Deploy and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

env:
  BASE_URL: https://pranovraaj.github.io/Sign-Speak-App-01

jobs:
  build_and_deploy:
    name: Build and Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0' # Adjust based on project
          channel: 'stable'

      - name: Install Dependencies
        working-directory: ./Frontend
        run: flutter pub get

      - name: Build Web Application
        working-directory: ./Frontend
        run: flutter build web --release --base-href /Sign-Speak-App-01/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./Frontend/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  e2e_testing:
    name: Run Selenium E2E Tests
    needs: build_and_deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Selenium Dependencies
        working-directory: ./automation
        run: npm install

      - name: Wait for Deployment
        run: |
          echo "Waiting for deployment to propagate..."
          sleep 30
          curl -I -f ${{ env.BASE_URL }} || (echo "Deployment not ready" && exit 1)

      - name: Run Selenium Tests
        working-directory: ./automation
        run: npm run test:e2e
        env:
          BASE_URL: ${{ env.BASE_URL }}

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Automation-Reports
          path: |
            automation/reports/
            automation/screenshots/
            automation/logs/
          retention-days: 30

      - name: Publish Summary
        if: always()
        run: |
          echo "# Live GitHub Pages E2E Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "Deployment URL: ${{ env.BASE_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "Build Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          cat automation/reports/Summary/summary.md >> $GITHUB_STEP_SUMMARY || true
