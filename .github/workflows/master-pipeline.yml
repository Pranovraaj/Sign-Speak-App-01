name: Master Enterprise Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

env:
  BASE_URL: https://pranovraaj.github.io/Sign-Speak-App-01

jobs:
  build_and_deploy:
    name: Build and Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
      - name: Install Dependencies
        working-directory: ./Frontend
        run: flutter pub get
      - name: Build Web Application
        working-directory: ./Frontend
        run: flutter build web --release --base-href /Sign-Speak-App-01/
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./Frontend/build/web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  selenium-testing:
    name: Selenium Web Tests
    needs: build_and_deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Selenium Dependencies
        working-directory: ./automation
        run: npm install
      - name: Wait for Deployment
        run: |
          echo "Waiting for deployment to propagate..."
          sleep 30
          curl -I -f ${{ env.BASE_URL }} || (echo "Deployment not ready" && exit 1)
      - name: Run Selenium Tests
        working-directory: ./automation
        run: npm run test:e2e
        env:
          BASE_URL: ${{ env.BASE_URL }}
      - name: Upload Selenium Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-Report
          path: |
            automation/reports/
            automation/screenshots/
            automation/logs/
          retention-days: 30

  appium-testing:
    name: Appium Mobile Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
      - name: Install App Dependencies
        working-directory: ./Frontend
        run: flutter pub get
      - name: Build Android APK
        working-directory: ./Frontend
        run: flutter build apk --debug
      - name: Setup Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2
      - name: Run Appium Server
        run: appium &
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 800
          disable-animations: true
          script: |
            echo "Emulator started, running tests..."
            cd automation-mobile && npm install && npm run test:android
      - name: Upload Appium Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Appium-Report
          path: automation-mobile/reports/
          retention-days: 30

  load-testing:
    name: K6 Load Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      - name: Run k6 Load Test
        run: k6 run --summary-export=load-test-summary.json Testing/load-testing/load_test.js
      - name: Upload Load Testing Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Load-Testing-Report
          path: load-test-summary.json
          retention-days: 30

  security-testing:
    name: Security and Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Run Unit Tests
        working-directory: ./Backend
        env:
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.AIVEN_DB_PASSWORD }}
        run: |
          chmod +x ./mvnw
          ./mvnw test
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Security-Report
          path: "Vulnerability Test Results/"
          retention-days: 30
