name: Unified Enterprise Testing Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
      - name: Install App Dependencies
        working-directory: ./Frontend
        run: flutter pub get
      - name: Build Android APK
        working-directory: ./Frontend
        run: flutter build apk --debug
      - name: Setup Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2
      - name: Run Appium Server
        run: appium &
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 800
          disable-animations: true
          script: |
            echo "Emulator started, running tests..."
            cd automation-mobile && npm install && npm run test:android
      - name: Upload Mobile Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-Automation-Reports
          path: automation-mobile/reports/
          retention-days: 30

  web-and-load-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Start Spring Boot Backend
        env:
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.AIVEN_DB_PASSWORD }}
        run: |
          cd Backend
          chmod +x mvnw
          ./mvnw spring-boot:run &
          echo "Waiting 45 seconds for backend to start up..."
          sleep 45
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Web Testing Dependencies
        run: npm install
        working-directory: Testing/web-selenium
      - name: Run Web Selenium Tests
        run: npm test
        working-directory: Testing/web-selenium
      - name: Upload Web Test Report (Excel)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-Excel-Report
          path: Testing/web-selenium/reports/*.xlsx
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      - name: Run k6 Load Test
        run: k6 run Testing/load-testing/load_test.js

  security-and-perf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Run Unit Tests
        working-directory: ./Backend
        env:
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.AIVEN_DB_PASSWORD }}
        run: |
          chmod +x ./mvnw
          ./mvnw test
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
      - name: Setup K6 for Performance Testing
        uses: grafana/setup-k6-action@v1
      - name: Run K6 Load Test
        working-directory: "./Vulnerability Test Results"
        run: k6 run k6-load-test.js || true
      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: Security-Reports
          path: "Vulnerability Test Results/"
          retention-days: 30
