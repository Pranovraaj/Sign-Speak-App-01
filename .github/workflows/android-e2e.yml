name: Android E2E Appium Automation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      - name: Install App Dependencies
        working-directory: ./Frontend
        run: flutter pub get

      - name: Build Android APK
        working-directory: ./Frontend
        run: flutter build apk --debug

      - name: Setup Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Run Appium Server
        run: appium &
        
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 800
          disable-animations: true
          script: |
            echo "Emulator started, running tests..."
            cd automation-mobile && npm install && npm run test:android

      - name: Upload Mobile Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-Automation-Reports
          path: automation-mobile/reports/
          retention-days: 30
